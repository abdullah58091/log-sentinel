# H2 in-memory database for automated tests
spring.datasource.url=jdbc:h2:mem:logsentineltest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA test configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT secret
jwt.secret=${JWT_SECRET:VGhpc0lzQVRlc3RTZWNyZXRLZXlGb3JMb2dTZW50aW5lbDIwMjY=}

# Local service configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.elasticsearch.uris=http://localhost:9200

GEMINI_API_KEY=test-api-key-for-context-load-only
